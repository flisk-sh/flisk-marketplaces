name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shunt-evals:
    # The shunt plugin's hooks run on every Read and Bash call of anyone who installs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash plugins/shunt/evals/run.sh

  apify-actors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test apify/actors/*/src/*.test.js

  readme-links:
    # The README advertises MCP endpoints; a dead host or repo link is a broken promise to anyone copying it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node --test scripts/check-readme-links.test.mjs
      - run: node scripts/check-readme-links.mjs
