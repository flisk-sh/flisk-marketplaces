name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shunt-evals:
    # The shunt plugin's hooks run on every Read and Bash call of anyone who installs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash plugins/shunt/evals/run.sh

  apify-actors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test apify/actors/*/src/*.test.js
